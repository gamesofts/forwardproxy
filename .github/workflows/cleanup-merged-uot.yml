name: Clean merged UoT branch
on:
  push:
    branches: [naive]
    paths: ['.github/workflows/cleanup-merged-uot.yml']
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'gamesofts/forwardproxy' && github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: naive
          fetch-depth: 0
      - name: Delete only the verified merged branch head
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c9fbb776c2b87aed310788f4d47d311d045683f2 HEAD
          if [[ -z "$(git ls-remote --heads origin refs/heads/feat/naive-udp-over-tcp)" ]]; then
            echo 'Feature branch is already absent.'
            exit 0
          fi
          git push --force-with-lease=refs/heads/feat/naive-udp-over-tcp:c9fbb776c2b87aed310788f4d47d311d045683f2 origin :refs/heads/feat/naive-udp-over-tcp
